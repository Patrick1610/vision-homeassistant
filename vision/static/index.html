<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#286650" />
    <title>Vision · Home Assistant</title>
    <link rel="stylesheet" href="static/style.css" />
    <script src="static/home.js" defer></script>
    <script src="static/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside>
      <a class="brand" href="#today">
        <span class="wordmark">Vision<span class="brand-accent" aria-hidden="true"></span></span>
        <small id="app-version">{{VISION_VERSION}}</small>
      </a>
      <p class="tagline">Understand your home.</p>
      <nav id="nav" aria-label="Main navigation"></nav>
      <details id="expert-nav"><summary>Expert views</summary><nav id="expert-links" aria-label="Expert navigation"></nav></details>
      <div class="safety">
        ◈ READ ONLY<br /><small>No controls. Just clarity.</small>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <header>
        <div>
          <p class="eyebrow">HOME ASSISTANT OBSERVATORY</p>
          <h1 id="title">Overview</h1>
        </div>
        <span id="connection" class="badge">Connecting…</span>
      </header>
      <p id="notice" role="status"></p>
      <div id="content" aria-live="polite"></div>
      <footer>Jarvis controls the house. Vision understands the house.</footer>
    </main>
  </body>
</html>
