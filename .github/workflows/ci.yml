name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-test.txt
      - run: python -m pytest -q
      - run: ruff check . && ruff format --check vision tests scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: node --check vision/static/app.js
      - run: python scripts/check_publication.py
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - run: docker build --platform ${{ matrix.platform }} --build-arg BUILD_ARCH=${{ matrix.arch }} -t vision:test .
      - run: python3 scripts/container_smoke.py vision:test
